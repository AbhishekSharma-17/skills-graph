name: Bug Report
description: Report a broken reference, incorrect routing, or other issue in a skill
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill in the details below.

  - type: dropdown
    id: skill
    attributes:
      label: Which skill is affected?
      options:
        - agno-skill
        - ms-agent-framework
        - _template
        - Other (specify below)
    validations:
      required: true

  - type: input
    id: file
    attributes:
      label: Specific file (if applicable)
      description: e.g., `references/tools.md` or `SKILL.md`
      placeholder: references/example.md

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What went wrong? What did you expect to happen?
      placeholder: |
        The routing table in SKILL.md references `references/foo.md` but the file doesn't exist...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Load the skill in Claude Code
        2. Ask about topic X
        3. Agent tries to read references/foo.md
        4. File not found

  - type: dropdown
    id: check
    attributes:
      label: Did you run the integrity check?
      description: "Run: `python <skill>/scripts/check-updates.py --integrity`"
      options:
        - "Yes - it found the issue"
        - "Yes - it passed (issue is different)"
        - "No"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Platform, version, screenshots, etc.
